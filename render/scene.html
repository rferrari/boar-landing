<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BOAR film (scene)</title>
<style>
  @font-face { font-family: "Archivo"; src: url("../public/fonts/Archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Fraunces"; font-style: italic; src: url("../public/fonts/Fraunces-italic-var.woff2") format("woff2"); font-weight: 300 700; }
  /* the app's own families on Android: sans-serif (Roboto) and monospace (Noto Sans Mono) */
  @font-face { font-family: "Roboto"; src: url("fonts/Roboto-var.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Noto Sans Mono"; src: url("fonts/NotoSansMono-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * BOAR "No Signal": six places where the phone has no network, one question in
 * each, answered on the phone. The phone, its status bar ("No Service" /
 * airplane mode) and the app chrome never move; the world changes around them.
 *
 * Every pixel is a pure function of t. Scenes only exist inside their own time
 * window; the one thing on screen across the loop point (the end card's sky
 * before dawn) is periodic over T = 15 s, so frame(0) === frame(15).
 *
 * Questions and sources: each source is an article in the Wikipedia Vital
 * Articles pack BOAR can download (checked against the Vital Articles lists).
 * Answers are abridged and written for the film. The train question is from
 * BOAR's eval set v1 (reasoning-1); the default model answered 6:15 pm in the
 * 2026-09-24 baseline run. It is reasoning, so it shows no sources.
 * The screen is the BOAR chat UI, redrawn from the app's screenshots.
 */
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080);
const LAND = W >= H;
const S = LAND ? H / 1080 : W / 1080;
const T = 15;
const TAU = Math.PI * 2;

const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// ---------- brand tokens (swap here for a brand guide; scene illustration palettes live in each scene) ----------
const BRAND = {
  font: "Archivo",
  serif: "Fraunces",      // italic accent, the hand-set voice of the end line
  sun: "#f2b13e",         // end-card glow and phone rim
  leaf: "#8cc063",
  soil: "#c46a3c",
  sky: "#7cc3da",
  dawnTop: "#0d1c1e",     // the end card's sky before dawn, top to horizon
  dawnMid: "#15302b",
  dawnLow: "#3a3a2c",
  endText: "#fff8ea",
  ink: "#1d2419",
  endLine: "Knowledge you can carry.",
  endSub: "BOAR · answers on your phone, signal or not",
};
const endAccent = BRAND.sun;

// ---------- layout ----------
const F = LAND ? { x: 0.42 * W, y: 0.46 * H } : { x: 0.5 * W, y: 0.36 * H };   // focal point: window, tunnel, sun
const HY = LAND ? 0.6 * H : 0.46 * H;                                            // sea / city horizon
// The phone is designed at 640 wide (x S) and scaled by K in portrait so its type stays legible on a phone.
const CW = 640 * S, CH = (LAND ? 760 : 690) * S, K = LAND ? 1 : 1.28;
const CX = LAND ? 0.615 * W : (W - CW * K) / 2;
const CY = LAND ? 0.5 * H - CH / 2 + 34 * S : 0.5 * H;
const CCX = CX + CW * K / 2, CCY = CY + CH * K / 2;   // card centre on screen

// ---------- the six situations ----------
// q: the question. a: an abridged answer ("…" marks the cut). src: the pack article that covers it
// (empty for reasoning: the answer is worked out, not looked up).
const SC = [
  { id: "flight", tag: "In flight", clock: "19:40", air: true, accent: "#f6a96b",
    q: "The man next to me is choking and can't speak. What do I do?",
    a: "Lean him forward and give up to five firm blows between the shoulder blades. If that fails, give up to five abdominal thrusts. Keep alternating, and call the crew. …",
    src: ["Choking"] },
  { id: "subway", tag: "Underground", clock: "15:52", accent: "#5fd6a4",
    q: "A train leaves at 3:40 pm and the trip takes 2 hours and 35 minutes. What time does it arrive?",
    a: "3:40 pm plus 2 hours is 5:40 pm. Add 35 minutes: 5:40 + 0:20 is 6:00, and 15 more makes 6:15 pm.",
    src: [] },
  { id: "peak", tag: "Mountain hut", clock: "06:20", accent: "#f2c14e",
    q: "My friend is shivering, clumsy and slurring words. Is it hypothermia?",
    a: "Those are classic signs. Get her out of the wind, swap wet clothes for dry layers, warm her core first, and give a warm sweet drink if she's alert. …",
    src: ["Hypothermia"] },
  { id: "garden", tag: "In the garden", clock: "18:10", accent: "#a6d16a",
    q: "Why plant corn, beans and squash together?",
    a: "They help each other. Corn gives the beans a pole to climb, beans add nitrogen to the soil, and squash leaves shade the ground and hold in moisture. …",
    src: ["Companion planting"] },
  { id: "sea", tag: "At sea", clock: "14:05", accent: "#7cc3da",
    q: "Thunder came 9 seconds after the flash. How far away is the storm?",
    a: "Sound covers about 1 km every 3 seconds, so roughly 3 km. That's close: head for shore or shelter now. …",
    src: ["Thunder", "Lightning"] },
  { id: "road", tag: "Flooded road", clock: "20:05", accent: "#ec9467",
    q: "Water is running across the road ahead. Can I drive through it?",
    a: "Don't. Moving water can float a car even when it looks shallow, and the road underneath may be gone. Turn around and wait on higher ground. …",
    src: ["Flash flood"] },
];
const B = [0, 2.3, 4.4, 6.5, 8.6, 10.7, 13.0, 15];   // scene starts; 13.0-15 is the end card

// ---------- helpers and the six places live in world.js; the foliage frame in nature.js ----------
</script>
<script src="world.js"></script>
<script src="nature.js"></script>
<script>
function drawWorld(tau) {
  const lt = (i) => tau - B[i];
  // E -> flight: pull back out of the window (the end card's sky becomes the window)
  if (tau < 0.55) {
    const e = eIO(inv(0, 0.55, tau));
    drawEndSky(tau);
    drawFlight(lt(0), { z: Math.pow(9, 1 - e), portal: inScreen(() => drawEndSky(tau)), skyA: clamp((e - 0.15) / 0.6) });
    return;
  }
  // flight -> subway: through the window, into the tunnel mouth
  if (tau < 2.1) return drawFlight(lt(0));
  if (tau < 2.5) {
    const e = inv(2.1, 2.5, tau), z = Math.pow(9, e * e);
    return drawFlight(lt(0), { z, portal: inScreen(() => drawSubway(lt(1), { z: lerp(0.7, 1, e) })), skyA: 0 });
  }
  // subway -> peak: out through the light at the end of the tunnel
  if (tau < 4.15) return drawSubway(lt(1));
  if (tau < 4.6) {
    const e = inv(4.15, 4.6, tau), d = Math.hypot(W, H);
    drawSubway(lt(1), { boost: 3 * e * e, exitR: lerp(13 * S, d, Math.pow(e, 2.4)), portal: inScreen(() => drawPeak(lt(2))) });
    const fl = clamp(1 - Math.abs(e - 0.75) / 0.25) * 0.55;
    if (fl > 0) { ctx.fillStyle = `rgba(255,236,220,${fl})`; ctx.fillRect(0, 0, W, H); }
    return;
  }
  // peak -> garden: whip tilt down, off the mountain
  if (tau < 6.3) return drawPeak(lt(2));
  if (tau < 6.72) {
    const e = eIO(inv(6.3, 6.72, tau));
    clipRect(0, -e * H, W, H, () => drawPeak(lt(2), { dy: -e * H }));
    clipRect(0, (1 - e) * H, W, H, () => drawGarden(lt(3), { dy: (1 - e) * H }));
    const a = Math.sin(e * Math.PI) * 0.5, R = rng(4);
    ctx.fillStyle = `rgba(255,255,255,${a * 0.5})`;
    for (let i = 0; i < 40; i++) ctx.fillRect(R() * W, R() * H - 200 * S, (1 + R() * 3) * S, (120 + R() * 400) * S);
    return;
  }
  // garden -> sea: a wall of leaves sweeps across
  if (tau < 8.35) return drawGarden(lt(3));
  if (tau < 8.85) {
    const e = eIO(inv(8.35, 8.85, tau)), X = lerp(W + 0.35 * W, -0.45 * W, e);
    drawGarden(lt(3));
    clipRect(X, -10, W * 2, H + 20, () => drawSea(lt(4)));
    const R = rng(12);
    for (let i = 0; i < 26; i++) {
      const y = (i / 25) * (H + 200 * S) - 100 * S, len = (380 + R() * 380) * S;
      leaf(X - 120 * S + R() * 160 * S, y, len, len * 0.24, Math.PI + (R() - 0.5) * 1.2 + e * 0.6, R() < 0.5 ? "#3f6a2c" : "#5a8a3a", "rgba(230,240,180,0.5)");
    }
    return;
  }
  // sea -> road: the horizon holds, the world splits open along it
  if (tau < 10.5) return drawSea(lt(4));
  if (tau < 10.92) {
    const e = eIO(inv(10.5, 10.92, tau));
    drawSea(lt(4));
    const top = HY - e * (HY + 20), bot = HY + e * (H - HY + 20);
    clipRect(0, top, W, bot - top, () => drawRoad(lt(5)));
    ctx.fillStyle = `rgba(255,255,255,${0.9 * (1 - e)})`; ctx.fillRect(0, top - 2 * S, W, 3 * S); ctx.fillRect(0, bot - 1 * S, W, 3 * S);
    return;
  }
  // road -> end: tilt up past the clearing storm into the sky before dawn
  if (tau < 12.8) return drawRoad(lt(5));
  if (tau < 13.35) {
    const e = eIO(inv(12.8, 13.35, tau));
    drawEndSky(tau);
    ctx.save(); ctx.globalAlpha = 1 - clamp((e - 0.55) / 0.45);
    clipRect(0, e * H * 0.9, W, H, () => drawRoad(lt(5), { dy: e * H * 0.9 }));
    ctx.restore();
    ctx.fillStyle = vg(e * H * 0.9 - 10, e * H * 0.9 + 400 * S, [[0, rgba(BRAND.dawnMid, 1)], [1, rgba(BRAND.dawnMid, 0)]]);
    if (e > 0.02) ctx.fillRect(0, e * H * 0.9 - 10, W, 410 * S);
    return;
  }
  drawEndSky(tau);
}

// ============================================================
// THE CARD: the real BOAR chat screen, inside a phone. The status bar
// ("No Service" / airplane mode) and the app chrome never move; each place gets
// one question, an abridged answer and the pack article behind it.
// Layout and colours are measured from docs/demo/screenshots/01-offline-answer-sources.png
// (rferrari/boar-app).
// ============================================================
const VW = LAND ? 540 : 460;    // the app screen's width in app px (540 = the demo screenshots' width)
const U = CW / VW;              // app px -> design px
const u = (v) => v * U;
function sceneAt(tau) { let i = 0; for (let k = 0; k < 6; k++) if (tau >= B[k]) i = k; return i; }
function accentAt(tau) {
  if (tau >= 13.0 || tau < 0.3) return endAccent;
  const i = sceneAt(tau);
  if (i === 0) return SC[0].accent;
  return mixHex(SC[i - 1].accent, SC[i].accent, clamp((tau - B[i] + 0.15) / 0.3));
}
function drawCardLayer(tau) {
  ctx.save(); ctx.translate(CX, CY); ctx.scale(K, K); ctx.translate(-CX, -CY);
  drawCardLayerInner(tau);
  ctx.restore();
}
function drawCardLayerInner(tau) {
  // morph: phone <-> round badge with the mascot (end card)
  let m = 0;
  if (tau >= 13.05) m = eIO(inv(13.05, 13.6, tau));
  else if (tau < 0.5) m = 1 - eIO(inv(0.0, 0.5, tau));
  const D = 300 * S;
  const ccx = CX + CW / 2, ccy = lerp(CY + CH / 2, CY + CH / 2 - (LAND ? 90 : 60) * S, m);
  const w = lerp(CW, D, m), h = lerp(CH, D, m), r = lerp(46 * S, D / 2, m);
  const x = ccx - w / 2, y = ccy - h / 2;
  const acc = accentAt(tau);


  // pop on every cut
  let pop = 1;
  for (let k = 1; k < 7; k++) { const d = tau - B[k]; if (d >= 0 && d < 0.35) pop = 1 + 0.018 * Math.sin((d / 0.35) * Math.PI); }
  ctx.save();
  ctx.translate(ccx, ccy); ctx.scale(pop, pop); ctx.translate(-ccx, -ccy);
  // phone body: near-black bezel, a rim of the place's light
  ctx.shadowColor = "rgba(30,40,24,0.32)"; ctx.shadowBlur = 36 * S; ctx.shadowOffsetY = 18 * S;
  rr(x - 3 * S, y - 3 * S, w + 6 * S, h + 6 * S, r + 3 * S); ctx.fillStyle = BRAND.ink; ctx.fill();
  ctx.shadowColor = "transparent";
  rr(x, y, w, h, r); ctx.fillStyle = "#0a0b0f"; ctx.fill();
  rr(x, y, w, h, r); ctx.strokeStyle = rgba(acc, 0.85); ctx.lineWidth = 2.5 * S; ctx.stroke();
  rr(x + 2.5 * S, y + 2.5 * S, w - 5 * S, h - 5 * S, r - 2.5 * S); ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 1.2 * S; ctx.stroke();
  const b = lerp(10 * S, 0, m), sx = x + b, sy = y + b, sw = w - 2 * b, sh = h - 2 * b, sr = Math.max(0, r - b);
  ctx.save(); rr(sx, sy, sw, sh, sr); ctx.clip();
  ctx.fillStyle = m > 0 ? mix(APP.chat, APP.header, m) : APP.chat; ctx.fillRect(sx, sy, sw, sh);
  const cA = clamp(1 - m * 2.2);
  if (cA > 0) { ctx.globalAlpha = cA; drawScreen(tau, sx, sy, sw, sh); ctx.globalAlpha = 1; }
  const pA = clamp((m - 0.45) / 0.4);
  if (pA > 0 && ICON) {
    const s = D * 0.84 * lerp(0.7, 1, eBack(pA));
    const bb = [138, 198, 690, 606];   // mascot bounding box inside the 1024px icon
    const k = s / 690;
    ctx.globalAlpha = pA;
    ctx.drawImage(ICON, bb[0], bb[1], bb[2], bb[3], ccx - bb[2] * k / 2, ccy - bb[3] * k / 2 + 4 * S, bb[2] * k, bb[3] * k);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.restore();

  // end line
  let tA = 0;
  if (tau >= 13.3) tA = eO(inv(13.3, 13.8, tau)); else if (tau < 0.2) tA = 1 - inv(0, 0.2, tau);
  if (tA > 0) {
    const ty = ccy + D / 2 + 96 * S + (1 - tA) * 20 * S;
    ctx.globalAlpha = tA; ctx.textAlign = "center";
    ctx.font = `italic 560 ${(LAND ? 68 : 62) * S}px ${BRAND.serif}`; ctx.fontStretch = "normal"; ctx.letterSpacing = `${-0.5 * S}px`;
    { const lw = ctx.measureText(BRAND.endLine).width + 70 * S, lh = (LAND ? 150 : 140) * S; rr(ccx - lw / 2, ty - 78 * S, lw, lh, 24 * S); ctx.fillStyle = "rgba(255,250,238,0.96)"; ctx.fill(); ctx.strokeStyle = BRAND.ink; ctx.lineWidth = 2.5 * S; ctx.stroke(); }
    ctx.fillStyle = BRAND.ink;
    ctx.fillText(BRAND.endLine, ccx, ty);
    font(500, (LAND ? 25 : 21) * S); ctx.letterSpacing = `${0.5 * S}px`; ctx.fillStyle = "#3d4636";
    ctx.fillText(BRAND.endSub, ccx, ty + 54 * S);
    ctx.globalAlpha = 1; ctx.textAlign = "left"; ctx.letterSpacing = "0px";
  }

  // location tag
  if (tau >= 0.3 && tau < 13.0) {
    const i = sceneAt(tau), start = i === 0 ? 0.35 : B[i] + 0.02, end = B[i + 1];
    const inE = eO(clamp((tau - start) / 0.3)), outE = clamp((end - tau) / 0.15);
    const a = SC[i].accent, label = SC[i].tag.toUpperCase();
    font(800, 27 * S, "semi-condensed"); ctx.letterSpacing = `${2.5 * S}px`;
    const tw = ctx.measureText(label).width, pw = tw + 64 * S, ph = 50 * S, px = CX, py = CY - ph - 18 * S;
    ctx.save(); ctx.globalAlpha = outE;
    ctx.beginPath(); ctx.rect(px - 4 * S, py - 4 * S, (pw + 8 * S) * inE, ph + 8 * S); ctx.clip();
    rr(px, py, pw, ph, ph / 2); ctx.fillStyle = a; ctx.fill(); ctx.strokeStyle = BRAND.ink; ctx.lineWidth = 2.5 * S; ctx.stroke();
    const dark = lum(a) > 0.35;
    ctx.fillStyle = dark ? "#0c0c12" : "#ffffff";
    ctx.beginPath(); ctx.arc(px + 24 * S, py + ph / 2, 6 * S, 0, TAU); ctx.fill();
    ctx.fillText(label, px + 40 * S, py + ph / 2 + 9.5 * S);
    ctx.restore(); ctx.letterSpacing = "0px";
  }
}

// One exchange, as the app lays it out. Returns the bubbles' geometry for a given reveal state.
function drawScreen(tau, X, Y, SW, SH) {
  const i = tau >= 13.0 ? 5 : sceneAt(tau);
  const D = SC[i];
  const start = i === 0 ? 0.3 : B[i] + 0.04;
  const ct = tau - start;
  const T_SEND = 0.3, T_A0 = 0.42, T_A1 = 1.22, T_DONE = 1.26;
  const SB = u(40), HD = u(72), IB = u(84);

  // ---- chat background, with the app's soft backdrop circles ----
  ctx.fillStyle = APP.chat; ctx.fillRect(X, Y, SW, SH);
  ctx.fillStyle = APP.chatShade; ctx.beginPath(); ctx.arc(X + SW * 0.95, Y + SH * 0.95, u(230), 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.16)"; ctx.beginPath(); ctx.arc(X + SW * 0.9, Y - u(40), u(300), 0, TAU); ctx.fill();

  // ---- conversation (clipped between the header and the input bar, auto-scrolled to the end) ----
  const vTop = Y + SB + HD, vBot = Y + SH - IB, vH = vBot - vTop;
  const inA = clamp(ct / 0.12), outA = clamp((B[i + 1] - tau - 0.02) / 0.14), cA = Math.min(inA, outA);
  const M = u(14), maxW = (SW - 2 * M) * 0.92, pad = u(14);
  // user bubble
  af(400, 18); const qLines = wrapW(D.q, maxW - 2 * pad), qlh = u(26);
  const qW = Math.min(maxW, Math.max(u(60), ...qLines.map((l) => ctx.measureText(l.join(" ")).width)) + 2 * pad);
  const qH = pad + u(17) + qLines.length * qlh + pad - u(4);
  // assistant bubble
  af(400, 18); const aW = maxW, aLines = wrapW(D.a, aW - 2 * pad), alh = u(27);
  const words = D.a.split(" ").length;
  const aP = clamp((ct - T_A0) / (T_A1 - T_A0));
  const nShow = Math.floor(aP * words + 0.001);
  let k = 0, linesShown = 0; aLines.forEach((l) => { if (nShow > k) linesShown++; k += l.length; });
  const done = ct >= T_DONE;
  const srcP = eO(clamp((ct - T_DONE) / 0.22));
  const nSrc = D.src.length, chipH = u(32), chipG = u(6);
  const srcBlock = nSrc ? u(6) + u(4) + u(26) + nSrc * (chipH + chipG) : 0;
  const footBlock = u(36);
  const streamingRows = !done && ct >= T_A0 ? u(22) : 0;
  const aH = pad + u(20) + Math.max(1, linesShown) * alh + streamingRows + srcBlock * srcP + footBlock + pad - u(4);
  const gap = u(12);
  const showQ = ct >= T_SEND, showA = ct >= T_SEND + 0.08;
  const contentH = u(12) + (showQ ? qH : 0) + (showA ? gap + aH : 0) + u(12);
  // The chat follows the answer down, but stops while the question's last line is still on screen
  // (the state you get by nudging the list up a little), so the question never leaves the frame.
  const qKeep = showQ ? u(12) + qH - u(46) : 0;
  const scroll = clamp(contentH - vH, 0, Math.max(0, qKeep));

  ctx.save(); ctx.beginPath(); ctx.rect(X, vTop, SW, vH); ctx.clip();
  ctx.globalAlpha *= cA;
  let cy = vTop + u(12) - scroll;
  if (showQ) {
    const qx = X + SW - M - qW, pp = eBack(clamp((ct - T_SEND) / 0.18));
    ctx.save(); ctx.translate(qx + qW, cy + qH); ctx.scale(pp, pp); ctx.translate(-(qx + qW), -(cy + qH));
    ctx.beginPath(); ctx.roundRect(qx, cy, qW, qH, [u(12), u(12), u(4), u(12)]); ctx.fillStyle = APP.userBg; ctx.fill();
    ctx.strokeStyle = APP.userBorder; ctx.lineWidth = u(1.6); ctx.stroke();
    af(600, 11.5, APP.mono); ctx.letterSpacing = `${u(0.6)}px`; ctx.fillStyle = APP.you; ctx.fillText("YOU", qx + pad, cy + pad + u(11)); ctx.letterSpacing = "0px";
    af(400, 18); ctx.fillStyle = APP.text;
    qLines.forEach((l, li) => ctx.fillText(l.join(" "), qx + pad, cy + pad + u(17) + qlh * (li + 1) - u(7)));
    ctx.restore();
    cy += qH + gap;
  }
  if (showA) {
    const ax = X + M, ap = eO(clamp((ct - T_SEND - 0.08) / 0.16));
    ctx.save(); ctx.globalAlpha *= ap; ctx.translate(0, (1 - ap) * u(10));
    ctx.beginPath(); ctx.roundRect(ax, cy, aW, aH, [u(12), u(12), u(12), u(4)]); ctx.fillStyle = APP.astBg; ctx.fill();
    ctx.strokeStyle = APP.astBorder; ctx.lineWidth = u(1.2); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(ax, cy, aW, aH); ctx.clip();
    let yy = cy + pad;
    af(400, 11, "Apple Color Emoji"); ctx.fillText("🐗", ax + pad, yy + u(11));
    af(600, 11.5, APP.mono); ctx.letterSpacing = `${u(0.6)}px`; ctx.fillStyle = APP.boar; ctx.fillText("BOAR", ax + pad + u(20), yy + u(11)); ctx.letterSpacing = "0px";
    yy += u(20);
    af(400, 18); ctx.fillStyle = APP.text;
    let kk = 0;
    aLines.forEach((l, li) => { const shown = l.slice(0, Math.max(0, nShow - kk)); kk += l.length; if (shown.length) ctx.fillText(shown.join(" "), ax + pad, yy + alh * (li + 1) - u(7)); });
    yy += Math.max(1, linesShown) * alh;
    if (streamingRows) { rr(ax + pad, yy + u(2), u(8), u(18), u(2)); ctx.fillStyle = rgba(APP.cursor, 0.85); ctx.fill(); yy += streamingRows; }
    const ys = yy;
    if (srcP > 0 && nSrc) {
      ctx.save(); ctx.globalAlpha *= srcP;
      yy += u(6); ctx.fillStyle = APP.rule; ctx.fillRect(ax + pad, yy, aW - 2 * pad, u(1)); yy += u(4);
      af(400, 11, "Apple Color Emoji"); ctx.fillText("📚", ax + pad, yy + u(15));
      af(700, 11.5, APP.mono); ctx.letterSpacing = `${u(0.55)}px`; ctx.fillStyle = APP.srcTitle; ctx.fillText("OFFLINE VERIFIED SOURCES", ax + pad + u(18), yy + u(15)); ctx.letterSpacing = "0px";
      af(400, 11, APP.mono); const cn = String(nSrc), cw = ctx.measureText(cn).width + u(10);
      rr(ax + aW - pad - cw, yy + u(3), cw, u(16), u(4)); ctx.fillStyle = APP.countBg; ctx.fill(); ctx.fillStyle = APP.count; ctx.fillText(cn, ax + aW - pad - cw + u(5), yy + u(15));
      yy += u(26);
      D.src.forEach((s, j) => {
        const cx0 = ax + pad, cwid = aW - 2 * pad;

// the foliage frame (nature.js) in place of the old dark vignette: leaves hang in along the top,
// climbers run up the sides, a meadow along the bottom; the phone and the page's headline sit in the open
const FILM_FRAME = LAND
  ? { top: "both", reach: 1.1, reachL: 0.6, vines: [[0.015, 520, 5, { trail: "#c9b5f0" }], [0.555, 330, 6], [0.585, 540, 13, { trail: "#f5a8bd" }], [0.975, 520, 14, { trail: "#c9b5f0" }]], left: true, leftTop: 0.4, right: true, rightTop: 0.55, bottom: true, grassH: 56, corners: ["bl", "br"] }

window.renderFrame = function (t) {
  const tau = ((t % T) + T) % T;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
