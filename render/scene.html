<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BOAR no signal (scene)</title>
<style>
  @font-face { font-family: "Archivo"; src: url("../public/fonts/Archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * BOAR "No Signal": six places where the phone has no network, one question in
 * each, answered offline with its source. The answer card and its status bar
 * ("No Service" / airplane mode) never move; the world changes around them.
 *
 * Every pixel is a pure function of t. Scenes only exist inside their own time
 * window; the one thing on screen across the loop point (the end card's night
 * sky) is periodic over T = 15 s, so frame(0) === frame(15). See DESIGN.md.
 *
 * Questions: BOAR eval set v1 (docs/EVAL_QUERIES.md). Sources: the expected
 * article that retrieval returned for that question in the 2026-09-24 baseline
 * run (docs/evidence/2026-09-24-baseline-5-configs, "Retrieved articles per
 * query"). Answer text is a short plain summary, not a quoted model output.
 */
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080);
const LAND = W >= H;
const S = LAND ? H / 1080 : W / 1080;
const T = 15;
const TAU = Math.PI * 2;

const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// ---------- layout ----------
const F = LAND ? { x: 0.42 * W, y: 0.46 * H } : { x: 0.5 * W, y: 0.36 * H };   // focal point: window, tunnel, sun
const HY = LAND ? 0.6 * H : 0.46 * H;                                            // sea / city horizon
// The card is designed at 640x530 (x S) and scaled by K in portrait so its type stays legible on a phone.
const CW = 640 * S, CH = 530 * S, K = LAND ? 1 : 1.28;
const CX = LAND ? 0.615 * W : (W - CW * K) / 2;
const CY = LAND ? 0.5 * H - CH / 2 + 30 * S : 0.585 * H;
const CCX = CX + CW * K / 2, CCY = CY + CH * K / 2;   // card centre on screen

// ---------- the six situations ----------
const SC = [
  { id: "flight", tag: "In flight", clock: "23:40", air: true, accent: "#a898ff",
    q: "What is a black hole and how does one form?",
    a: "A region where gravity is so strong that nothing, not even light, can escape. Most form when a massive star collapses at the end of its life.",
    src: ["Black hole"] },
  { id: "subway", tag: "Underground", clock: "08:15", accent: "#3fe8b4",
    q: "Why did the Western Roman Empire fall?",
    a: "No single cause. Civil wars, a strained economy and pressure from Germanic peoples wore it down until the last western emperor was deposed in 476.",
    src: ["Fall of the Western Roman Empire"] },
  { id: "peak", tag: "Above the treeline", clock: "06:20", accent: "#ff7d5e",
    q: "Explain photosynthesis in simple terms.",
    a: "Plants use sunlight to turn water and carbon dioxide into the sugar they live on, and release oxygen as a by-product.",
    src: ["Photosynthesis"] },
  { id: "jungle", tag: "Rainforest field camp", clock: "15:30", accent: "#ffcc1f",
    q: "Why is the Amazon rainforest considered important for global climate?",
    a: "It stores a vast amount of carbon and recycles moisture into rain far beyond the forest. Losing it releases that carbon and weakens the water cycle.",
    src: ["Amazon rainforest"] },
  { id: "sea", tag: "At sea", clock: "12:10", accent: "#59a8ff",
    q: "Who proposed the theory of evolution by natural selection?",
    a: "Charles Darwin, in On the Origin of Species (1859). Alfred Russel Wallace reached the same idea independently.",
    src: ["Evolution"] },
  { id: "city", tag: "Blackout", clock: "20:05", accent: "#ffae34",
    q: "Compare the French Revolution and the Industrial Revolution.",
    a: "One was political: it overthrew the French monarchy. The other was economic: machines and factories changed how people worked and lived.",
    src: ["French Revolution", "Industrial Revolution"] },
];
const B = [0, 2.3, 4.4, 6.5, 8.6, 10.7, 13.0, 15];   // scene starts; 13.0-15 is the end card

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eO = (t) => 1 - Math.pow(1 - t, 3);
const eI = (t) => t * t * t;
const eBack = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function noise1(seed) {
  const r = rng(seed), N = 512, v = Array.from({ length: N }, () => r() * 2 - 1);
  return (x) => { const i = Math.floor(x), f = x - i, a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
function mix(h1, h2, t) { const a = hex(h1), b = hex(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",")})`; }
function mixHex(h1, h2, t) { const a = hex(h1), b = hex(h2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, "0")).join(""); }
function lum(h) { const [r, g, b] = hex(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function vg(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function hg(x0, x1, stops) { const g = ctx.createLinearGradient(x0, 0, x1, 0); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rg(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function big(fill) { ctx.fillStyle = fill; ctx.fillRect(-4 * W, -4 * H, 9 * W, 9 * H); }
function font(w, px, stretch = "normal") { ctx.font = `${w} ${px}px Archivo`; ctx.fontStretch = stretch; }
// camera: zoom z about (cx, cy), then shift
function cam(o, cx = F.x, cy = F.y) {
  const z = o.z || 1;
  ctx.translate(cx + (o.dx || 0), cy + (o.dy || 0));
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);
}
function screen(fn) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); fn(); ctx.restore(); }
function leaf(x, y, len, wid, ang, col, rib) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(len * 0.25, -wid, len * 0.75, -wid * 0.9, len, 0);
  ctx.bezierCurveTo(len * 0.75, wid * 0.9, len * 0.25, wid, 0, 0);
  ctx.fillStyle = col; ctx.fill();
  if (rib) { ctx.strokeStyle = rib; ctx.lineWidth = Math.max(1, wid * 0.06); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -wid * 0.08, len * 0.97, 0); ctx.stroke(); }
  ctx.restore();
}

// ---------- seeded content ----------
let ICON;
const R0 = rng(7);
const SKY_STARS = Array.from({ length: 260 }, () => ({ x: R0() * W, y: R0() * H, r: (0.6 + R0() * R0() * 2.2) * S, a: 0.35 + R0() * 0.65, k: 2 + Math.floor(R0() * 6), p: R0() * TAU }));
const WIN_STARS = Array.from({ length: 70 }, () => ({ x: (R0() - 0.5) * 340, y: -240 + R0() * 250, r: 0.8 + R0() * 1.8, a: 0.4 + R0() * 0.6 }));
const nR = [noise1(11), noise1(23), noise1(37), noise1(41), noise1(53), noise1(67)];
function ridge(n, u) {
  const a = 1 - Math.abs(n(u)), b = 1 - Math.abs(n(u * 2.13 + 9.1)), c = n(u * 4.7 + 3.3);
  return 0.62 * a * a + 0.28 * b * b + 0.1 * c;
}
// city: three building layers across a wide strip, with windows
const CITY = [
  { pf: 0.3, col: "#3a2868", hMin: 120, hMax: 330, wMin: 70, wMax: 150, win: 0.0, ww: 7, wh: 9, gx: 16, gy: 20 },
  { pf: 0.6, col: "#211848", hMin: 160, hMax: 470, wMin: 90, wMax: 180, win: 0.55, ww: 8, wh: 11, gx: 19, gy: 25 },
  { pf: 1.0, col: "#0d0a22", hMin: 110, hMax: 380, wMin: 120, wMax: 230, win: 0.6, ww: 11, wh: 14, gx: 26, gy: 32 },
].map((L, li) => {
  const r = rng(100 + li); const b = []; let x = -0.6 * W;
  while (x < 1.8 * W) {
    const w = (L.wMin + r() * (L.wMax - L.wMin)) * S, h = (L.hMin + r() * (L.hMax - L.hMin)) * S * (LAND ? 1 : 1.25);
    const wins = [];
    if (L.win > 0) for (let yy = 22 * S; yy < h - 16 * S; yy += L.gy * S) for (let xx = 12 * S; xx < w - 12 * S; xx += L.gx * S) if (r() < L.win) wins.push({ x: xx, y: yy, j: r(), c: r() < 0.18 ? "#fff0c4" : r() < 0.5 ? "#ffc766" : "#ffb04a" });
    b.push({ x, w, h, wins, top: r() });
    x += w + (r() < 0.3 ? r() * 30 * S : -8 * S);
  }
  return { ...L, b };
});
// candles / torches that come back on after the blackout (building index, window index)
const JR = rng(5);
const JUNGLE = {
  far: Array.from({ length: 22 }, (_, i) => ({ x: (i / 22) * 2.4 * W - 0.6 * W + JR() * 60 * S, r: (70 + JR() * 90) * S, y: JR() })),
  trunks: Array.from({ length: 9 }, (_, i) => ({ x: (i / 9) * 2.2 * W - 0.5 * W + JR() * 120 * S, w: (26 + JR() * 40) * S, lean: (JR() - 0.5) * 0.08 })),
  blobs: Array.from({ length: 40 }, () => ({ x: JR() * 2.4 * W - 0.6 * W, y: JR() * 0.32 * H, r: (60 + JR() * 110) * S })),
};

// ============================================================
// SCENE 1: in flight, night, airplane mode
// ============================================================
function flightSky(cx, cy, lt, k) {
  ctx.fillStyle = vg(cy - 240 * S, cy + 240 * S, [[0, "#04061c"], [0.42, "#121a58"], [0.58, "#3a3796"], [0.66, "#8074dc"], [0.72, "#4b44a8"], [1, "#221e66"]]);
  ctx.fillRect(cx - 180 * S, cy - 250 * S, 360 * S, 500 * S);
  for (const s of WIN_STARS) { ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fillRect(cx + s.x * S, cy + s.y * S, s.r * S, s.r * S); }
  if (k === 0) {
    ctx.fillStyle = rg(cx + 70 * S, cy - 130 * S, 0, 140 * S, [[0, "rgba(255,244,214,0.55)"], [1, "rgba(255,244,214,0)"]]);
    ctx.fillRect(cx - 180 * S, cy - 250 * S, 360 * S, 300 * S);
    ctx.fillStyle = "#fff4da"; ctx.beginPath(); ctx.arc(cx + 70 * S, cy - 130 * S, 24 * S, 0, TAU); ctx.fill();
  }
  // sea of clouds, three layers rushing past
  const cols = [["#4a45a6", "#7d74db"], ["#6c63c8", "#a99ff2"], ["#9a90e8", "#e0dbff"]];
  for (let j = 0; j < 3; j++) {
    const y0 = cy + (40 + j * 62) * S, sp = (90 + j * 260) * S, amp = (10 + j * 9) * S, per = (34 + j * 22) * S;
    ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 260 * S);
    for (let x = cx - 200 * S; x <= cx + 200 * S; x += 5 * S) {
      const u = (x + lt * sp) / per;
      ctx.lineTo(x, y0 - amp * Math.abs(Math.sin(u)) - amp * 0.5 * Math.abs(Math.sin(u * 0.47 + j)));
    }
    ctx.lineTo(cx + 200 * S, cy + 260 * S); ctx.closePath();
    ctx.fillStyle = vg(y0 - amp * 1.5, y0 + 90 * S, [[0, cols[j][1]], [0.35, cols[j][0]], [1, "#1a1650"]]); ctx.fill();
  }
  if (k === 0) {
    // wing
    ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 132 * S); ctx.lineTo(cx + 104 * S, cy + 70 * S); ctx.lineTo(cx + 114 * S, cy + 80 * S); ctx.lineTo(cx - 200 * S, cy + 232 * S); ctx.closePath();
    ctx.fillStyle = vg(cy + 70 * S, cy + 232 * S, [[0, "#2a2566"], [1, "#0b0920"]]); ctx.fill();
    ctx.strokeStyle = "rgba(200,190,255,0.55)"; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 132 * S); ctx.lineTo(cx + 104 * S, cy + 70 * S); ctx.stroke();
    const on = ((lt * 1.25) % 1 + 1) % 1 < 0.14;
    if (on) { ctx.fillStyle = rg(cx + 110 * S, cy + 75 * S, 0, 40 * S, [[0, "rgba(255,70,70,0.95)"], [0.25, "rgba(255,70,70,0.5)"], [1, "rgba(255,70,70,0)"]]); ctx.fillRect(cx + 60 * S, cy + 25 * S, 100 * S, 100 * S); }
    ctx.fillStyle = on ? "#ff6a6a" : "#5a1a2a"; ctx.beginPath(); ctx.arc(cx + 110 * S, cy + 75 * S, 4 * S, 0, TAU); ctx.fill();
  }
}
function flightWindow(cx, cy, lt, k, portal, skyA) {
  // bezel
  rr(cx - 225 * S, cy - 305 * S, 450 * S, 610 * S, 215 * S);
  ctx.fillStyle = hg(cx - 225 * S, cx + 225 * S, [[0, "#4c3d97"], [0.5, "#6553b8"], [1, "#3a2d7e"]]); ctx.fill();
  rr(cx - 190 * S, cy - 262 * S, 380 * S, 524 * S, 190 * S);
  ctx.fillStyle = vg(cy - 262 * S, cy + 262 * S, [[0, "#1a1440"], [1, "#2f2672"]]); ctx.fill();
  ctx.save();
  rr(cx - 165 * S, cy - 235 * S, 330 * S, 470 * S, 165 * S); ctx.clip();
  if (portal) portal();
  if (!portal || skyA > 0) { ctx.globalAlpha = portal ? skyA : 1; flightSky(cx, cy, lt, k); ctx.globalAlpha = 1; }
  if (!portal || skyA > 0) {
    ctx.globalAlpha = portal ? skyA : 1;
    const sh = [0.62, 0.16, 0.34][k + 1];
    ctx.fillStyle = vg(cy - 235 * S, cy - 235 * S + 470 * S * sh, [[0, "#d7cffb"], [1, "#b3a7ee"]]);
    ctx.fillRect(cx - 170 * S, cy - 240 * S, 340 * S, 470 * S * sh + 5 * S);
    ctx.fillStyle = "#8f82d6"; ctx.fillRect(cx - 40 * S, cy - 235 * S + 470 * S * sh - 10 * S, 80 * S, 6 * S);
    // glass reflection
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.beginPath(); ctx.moveTo(cx - 120 * S, cy + 240 * S); ctx.lineTo(cx - 40 * S, cy + 240 * S); ctx.lineTo(cx + 150 * S, cy - 240 * S); ctx.lineTo(cx + 70 * S, cy - 240 * S); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawFlight(lt, o = {}) {
  ctx.save();
  const zi = 1 + 0.07 * clamp(lt / 2.5);
  const bob = Math.sin(lt * 6.1) * 2.5 * S + Math.sin(lt * 14.3) * 1.2 * S;
  cam({ z: (o.z || 1) * zi, dy: bob });
  big(vg(F.y - 900 * S, F.y + 900 * S, [[0, "#140f33"], [0.3, "#2c226a"], [0.55, "#3d3084"], [0.8, "#241c5a"], [1, "#0e0a26"]]));
  // warm pool of light from the reading lamp
  ctx.fillStyle = rg(F.x + 360 * S, F.y - 560 * S, 0, 1000 * S, [[0, "rgba(255,178,92,0.6)"], [0.35, "rgba(255,140,80,0.2)"], [1, "rgba(255,140,80,0)"]]);
  ctx.fillRect(F.x - 1500 * S, F.y - 1600 * S, 3500 * S, 2600 * S);
  // overhead bins
  ctx.fillStyle = vg(F.y - 1000 * S, F.y - 400 * S, [[0, "#0b0820"], [1, "#221a55"]]);
  ctx.fillRect(F.x - 3000 * S, F.y - 1400 * S, 6000 * S, 1000 * S);
  ctx.fillStyle = "rgba(255,190,120,0.55)"; ctx.fillRect(F.x - 3000 * S, F.y - 404 * S, 6000 * S, 3 * S);
  // lamp
  ctx.fillStyle = rg(F.x + 360 * S, F.y - 420 * S, 0, 60 * S, [[0, "rgba(255,236,190,1)"], [0.3, "rgba(255,200,130,0.6)"], [1, "rgba(255,200,130,0)"]]);
  ctx.fillRect(F.x + 290 * S, F.y - 480 * S, 140 * S, 120 * S);
  // panel seams
  ctx.strokeStyle = "rgba(10,6,30,0.35)"; ctx.lineWidth = 3 * S;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(F.x + (k * 600 + 300) * S, F.y - 400 * S); ctx.lineTo(F.x + (k * 600 + 300) * S, F.y + 1400 * S); ctx.stroke(); }
  for (const k of [-1, 0, 1]) flightWindow(F.x + k * 600 * S, F.y, lt, k, k === 0 ? o.portal : null, o.skyA ?? 1);
  // seat backs in the foreground
  const seat = (x, y, w, h) => {
    rr(x, y, w, h, [150 * S, 150 * S, 20 * S, 20 * S]); ctx.fillStyle = vg(y, y + h * 0.6, [[0, "#2a2160"], [1, "#0a0720"]]); ctx.fill();
    ctx.strokeStyle = "rgba(255,180,110,0.55)"; ctx.lineWidth = 3 * S; ctx.beginPath(); ctx.arc(x + w / 2, y + 150 * S, w / 2 - 2 * S, Math.PI * 1.08, Math.PI * 1.5); ctx.stroke();
    rr(x + w * 0.2, y + 26 * S, w * 0.6, 92 * S, 30 * S); ctx.fillStyle = "rgba(205,195,245,0.85)"; ctx.fill();
    ctx.fillStyle = "rgba(90,70,170,0.4)"; ctx.fillRect(x + w * 0.2, y + 96 * S, w * 0.6, 22 * S);
  };
  if (LAND) { seat(F.x - 720 * S, F.y + 330 * S, 420 * S, 700 * S); seat(F.x + 330 * S, F.y + 300 * S, 420 * S, 700 * S); }
  else { seat(F.x - 520 * S, F.y + 420 * S, 440 * S, 900 * S); seat(F.x + 180 * S, F.y + 460 * S, 440 * S, 900 * S); }
  ctx.restore();
}

// ============================================================
// SCENE 2: underground, a train in a tunnel
// ============================================================
function drawSubway(lt, o = {}) {
  ctx.save();
  cam({ z: o.z || 1, dx: Math.sin(lt * 29) * 1.8 * S, dy: Math.sin(lt * 23 + 1) * 1.8 * S });
  const vx = F.x, vy = F.y;
  big("#021210");
  const ph = lt * 7 + (o.boost || 0);
  const n0 = Math.floor(ph) + 1, N = 40;
  const fog = "#021210";
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, r = 470 * S / z;
    const f = clamp((z - 0.6) / 14);
    const base = n % 2 ? "#1c7563" : "#145a4c";
    ctx.fillStyle = mix(base, fog, Math.pow(f, 0.7));
    ctx.beginPath(); ctx.arc(vx, vy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = mix("#3fae90", fog, Math.pow(f, 0.6)); ctx.lineWidth = Math.max(1, 7 * S / z);
    ctx.stroke();
  }
  // cables along the walls (radial in projection)
  ctx.strokeStyle = "rgba(0,10,8,0.8)";
  for (const a of [-2.75, -2.62, 0.35, 2.95]) { ctx.lineWidth = 6 * S; ctx.beginPath(); ctx.moveTo(vx + Math.cos(a) * 30 * S, vy + Math.sin(a) * 30 * S); ctx.lineTo(vx + Math.cos(a) * 2600 * S, vy + Math.sin(a) * 2600 * S); ctx.stroke(); }
  // floor
  const Rb = 4000 * S;
  ctx.beginPath(); ctx.moveTo(vx, vy + 2 * S); ctx.lineTo(vx - 0.8 * Rb, vy + 0.6 * Rb); ctx.lineTo(vx + 0.8 * Rb, vy + 0.6 * Rb); ctx.closePath();
  ctx.fillStyle = vg(vy, vy + 700 * S, [[0, "#021210"], [1, "#0c2a24"]]); ctx.fill();
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, r = 470 * S / z, f = clamp((z - 0.6) / 14);
    ctx.fillStyle = mix("#2c4a42", fog, f);
    ctx.fillRect(vx - 0.36 * r, vy + 0.6 * r, 0.72 * r, Math.max(1, 0.05 * r));
  }
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(vx + s * 1 * S, vy + 1 * S); ctx.lineTo(vx + s * 0.2 * Rb, vy + 0.6 * Rb); ctx.lineTo(vx + s * 0.214 * Rb, vy + 0.6 * Rb); ctx.closePath();
    ctx.fillStyle = vg(vy, vy + 600 * S, [[0, "rgba(190,255,235,0.1)"], [1, "rgba(190,255,235,0.85)"]]); ctx.fill();
  }
  // lamps, streaking toward the camera
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, z2 = Math.max(0.12, z - 0.5), r = 470 * S / z, r2 = 470 * S / z2, f = clamp((z - 0.6) / 14);
    const lamps = n % 2 === 0 ? [[-2.3, "150,255,220"], [-0.84, "150,255,220"]] : [];
    if (n % 7 === 3) lamps.push([0.55, "255,80,60"]);
    for (const [a, c] of lamps) {
      const x1 = vx + Math.cos(a) * r * 0.9, y1 = vy + Math.sin(a) * r * 0.9, x2 = vx + Math.cos(a) * r2 * 0.9, y2 = vy + Math.sin(a) * r2 * 0.9;

  ctx.globalAlpha *= cA; ctx.translate(0, shift);

  // question bubble (typed)
  font(650, 27 * S);
  const qMax = w - 2 * P - 50 * S, qLines = wrap(D.q, qMax - 40 * S), lh = 35 * S;
  const qW = Math.min(qMax, Math.max(...qLines.map((l) => ctx.measureText(l.join(" ")).width)) + 44 * S), qH = qLines.length * lh + 26 * S;
  const qx = x + w - P - qW, qy = y + 158 * S;
  const pop = eBack(clamp(ct / 0.2));
  ctx.save(); ctx.translate(qx + qW, qy + qH); ctx.scale(pop, pop); ctx.translate(-(qx + qW), -(qy + qH));
  ctx.beginPath(); ctx.roundRect(qx, qy, qW, qH, [24 * S, 24 * S, 6 * S, 24 * S]); ctx.fillStyle = "#15151b"; ctx.fill();
  let chars = Math.floor(clamp((ct - 0.04) / 0.34) * D.q.length);
  ctx.fillStyle = "#ffffff";
  qLines.forEach((l, li) => { const s = l.join(" "); const shown = s.slice(0, Math.max(0, chars)); chars -= s.length + 1; ctx.fillText(shown, qx + 22 * S, qy + 13 * S + lh * (li + 1) - 9 * S); });
  ctx.restore();

  // answer (streamed word by word)
  font(450, 25 * S); ctx.fillStyle = ink;
  const aLines = wrap(D.a, w - 2 * P), alh = 35 * S, ay = qy + qH + 46 * S;
  const total = D.a.split(" ").length;
  const nShow = Math.floor(clamp((ct - 0.46) / 0.95) * total + 0.001);
  let k = 0, cx = 0, cy = 0;
  aLines.forEach((l, li) => {
    const shown = l.slice(0, Math.max(0, nShow - k)); k += l.length;
    if (!shown.length) return;
    const s = shown.join(" "); ctx.fillText(s, x + P, ay + li * alh); cx = x + P + ctx.measureText(s).width; cy = ay + li * alh;
  });
  if (nShow > 0 && nShow < total) { ctx.fillStyle = D.accent; rr(cx + 6 * S, cy - 19 * S, 11 * S, 23 * S, 3 * S); ctx.fill(); }

  // sources
  const sy = y + CH - 92 * S;
  const lblA = clamp((ct - 1.2) / 0.15);
  if (lblA > 0) {
    ctx.globalAlpha *= 1; font(750, 13.5 * S); ctx.letterSpacing = `${1.8 * S}px`; ctx.fillStyle = rgba("#6b6a72", lblA);
    ctx.fillText("OFFLINE SOURCE" + (D.src.length > 1 ? "S" : "") + " · WIKIPEDIA", x + P, sy); ctx.letterSpacing = "0px";
  }
  let sx = x + P;
  D.src.forEach((s, j) => {
    const p = clamp((ct - 1.25 - j * 0.1) / 0.22); if (p <= 0) return;
    font(650, 19 * S); const tw = ctx.measureText(s).width, cw = tw + 66 * S, chh = 44 * S, cy2 = sy + 14 * S;
    const sc = eBack(p);
    ctx.save(); ctx.translate(sx, cy2 + chh / 2); ctx.scale(sc, sc); ctx.translate(-sx, -(cy2 + chh / 2));
    rr(sx, cy2, cw, chh, 12 * S); ctx.fillStyle = rgba(D.accent, 0.2); ctx.fill(); ctx.strokeStyle = rgba(mixHex(D.accent, "#15151b", 0.35), 0.8); ctx.lineWidth = 1.5 * S; ctx.stroke();
    bookIcon(sx + 16 * S, cy2 + 13 * S, 20 * S, "#15151b");
    ctx.fillStyle = "#15151b"; ctx.fillText(s, sx + 48 * S, cy2 + 29 * S);
    ctx.restore();
    sx += cw + 12 * S;
  });
  ctx.restore();
}

function drawVignette() {
  const m = Math.max(W, H);
  ctx.fillStyle = rg(W * 0.55, H * 0.5, m * 0.3, m * 0.85, [[0, "rgba(0,0,8,0)"], [1, "rgba(0,0,8,0.42)"]]);
  ctx.fillRect(0, 0, W, H);
}

window.renderFrame = function (t) {
  const tau = ((t % T) + T) % T;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.letterSpacing = "0px"; ctx.textAlign = "left";
  ctx.clearRect(0, 0, W, H);
  drawWorld(tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawVignette();
  drawCardLayer(tau);
};

function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
window.ready = (async () => {
  await Promise.all([document.fonts.load("800 20px Archivo"), document.fonts.load("450 20px Archivo")]);
  ICON = await loadImage("assets/boar-icon.png");
  renderFrame(+(Q.get("t") || 0));
})();
</script>
