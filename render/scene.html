<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BOAR film (scene)</title>
<style>
  @font-face { font-family: "Archivo"; src: url("../public/fonts/Archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Fraunces"; font-style: italic; src: url("../public/fonts/Fraunces-italic-var.woff2") format("woff2"); font-weight: 300 700; }
  /* the app's own families on Android: sans-serif (Roboto) and monospace (Noto Sans Mono) */
  @font-face { font-family: "Roboto"; src: url("fonts/Roboto-var.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Noto Sans Mono"; src: url("fonts/NotoSansMono-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * BOAR "No Signal": six places where the phone has no network, one question in
 * each, answered on the phone. The phone, its status bar ("No Service" /
 * airplane mode) and the app chrome never move; the world changes around them.
 *
 * Every pixel is a pure function of t. Scenes only exist inside their own time
 * window; the one thing on screen across the loop point (the end card's sky
 * before dawn) is periodic over T = 15 s, so frame(0) === frame(15).
 *
 * Questions and sources: each source is an article in the Wikipedia Vital
 * Articles pack BOAR can download (checked against the Vital Articles lists).
 * Answers are abridged and written for the film. The train question is from
 * BOAR's eval set v1 (reasoning-1); the default model answered 6:15 pm in the
 * 2026-09-24 baseline run. It is reasoning, so it shows no sources.
 * The screen is the BOAR chat UI, redrawn from the app's screenshots.
 */
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = +(Q.get("h") || 1080);
const LAND = W >= H;
const S = LAND ? H / 1080 : W / 1080;
const T = 15;
const TAU = Math.PI * 2;

const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// ---------- brand tokens (swap here for a brand guide; scene illustration palettes live in each scene) ----------
const BRAND = {
  font: "Archivo",
  serif: "Fraunces",      // italic accent, the hand-set voice of the end line
  sun: "#f2b13e",         // end-card glow and phone rim
  leaf: "#8cc063",
  soil: "#c46a3c",
  sky: "#7cc3da",
  dawnTop: "#0d1c1e",     // the end card's sky before dawn, top to horizon
  dawnMid: "#15302b",
  dawnLow: "#3a3a2c",
  endText: "#fff8ea",
  endLine: "Knowledge you can carry.",
  endSub: "BOAR · answers on your phone, signal or not",
};
const endAccent = BRAND.sun;

// ---------- layout ----------
const F = LAND ? { x: 0.42 * W, y: 0.46 * H } : { x: 0.5 * W, y: 0.36 * H };   // focal point: window, tunnel, sun
const HY = LAND ? 0.6 * H : 0.46 * H;                                            // sea / city horizon
// The phone is designed at 640 wide (x S) and scaled by K in portrait so its type stays legible on a phone.
const CW = 640 * S, CH = (LAND ? 760 : 690) * S, K = LAND ? 1 : 1.28;
const CX = LAND ? 0.615 * W : (W - CW * K) / 2;
const CY = LAND ? 0.5 * H - CH / 2 + 34 * S : 0.5 * H;
const CCX = CX + CW * K / 2, CCY = CY + CH * K / 2;   // card centre on screen

// ---------- the six situations ----------
// q: the question. a: an abridged answer ("…" marks the cut). src: the pack article that covers it
// (empty for reasoning: the answer is worked out, not looked up).
const SC = [
  { id: "flight", tag: "In flight", clock: "19:40", air: true, accent: "#f6a96b",
    q: "The man next to me is choking and can't speak. What do I do?",
    a: "Lean him forward and give up to five firm blows between the shoulder blades. If that fails, give up to five abdominal thrusts. Keep alternating, and call the crew. …",
    src: ["Choking"] },
  { id: "subway", tag: "Underground", clock: "15:52", accent: "#5fd6a4",
    q: "A train leaves at 3:40 pm and the trip takes 2 hours and 35 minutes. What time does it arrive?",
    a: "3:40 pm plus 2 hours is 5:40 pm. Add 35 minutes: 5:40 + 0:20 is 6:00, and 15 more makes 6:15 pm.",
    src: [] },
  { id: "peak", tag: "Mountain hut", clock: "06:20", accent: "#f2c14e",
    q: "My friend is shivering, clumsy and slurring words. Is it hypothermia?",
    a: "Those are classic signs. Get her out of the wind, swap wet clothes for dry layers, warm her core first, and give a warm sweet drink if she's alert. …",
    src: ["Hypothermia"] },
  { id: "garden", tag: "In the garden", clock: "18:10", accent: "#a6d16a",
    q: "Why plant corn, beans and squash together?",
    a: "They help each other. Corn gives the beans a pole to climb, beans add nitrogen to the soil, and squash leaves shade the ground and hold in moisture. …",
    src: ["Companion planting"] },
  { id: "sea", tag: "At sea", clock: "14:05", accent: "#7cc3da",
    q: "Thunder came 9 seconds after the flash. How far away is the storm?",
    a: "Sound covers about 1 km every 3 seconds, so roughly 3 km. That's close: head for shore or shelter now. …",
    src: ["Thunder", "Lightning"] },
  { id: "road", tag: "Flooded road", clock: "20:05", accent: "#ec9467",
    q: "Water is running across the road ahead. Can I drive through it?",
    a: "Don't. Moving water can float a car even when it looks shallow, and the road underneath may be gone. Turn around and wait on higher ground. …",
    src: ["Flash flood"] },
];
const B = [0, 2.3, 4.4, 6.5, 8.6, 10.7, 13.0, 15];   // scene starts; 13.0-15 is the end card

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eO = (t) => 1 - Math.pow(1 - t, 3);
const eI = (t) => t * t * t;
const eBack = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function noise1(seed) {
  const r = rng(seed), N = 512, v = Array.from({ length: N }, () => r() * 2 - 1);
  return (x) => { const i = Math.floor(x), f = x - i, a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
function mix(h1, h2, t) { const a = hex(h1), b = hex(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",")})`; }
function mixHex(h1, h2, t) { const a = hex(h1), b = hex(h2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, "0")).join(""); }
function lum(h) { const [r, g, b] = hex(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function vg(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function hg(x0, x1, stops) { const g = ctx.createLinearGradient(x0, 0, x1, 0); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rg(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function big(fill) { ctx.fillStyle = fill; ctx.fillRect(-4 * W, -4 * H, 9 * W, 9 * H); }
function font(w, px, stretch = "normal") { ctx.font = `${w} ${px}px ${BRAND.font}`; ctx.fontStretch = stretch; }
// camera: zoom z about (cx, cy), then shift
function cam(o, cx = F.x, cy = F.y) {
  const z = o.z || 1;
  ctx.translate(cx + (o.dx || 0), cy + (o.dy || 0));
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);
}
function screen(fn) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); fn(); ctx.restore(); }
function leaf(x, y, len, wid, ang, col, rib) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(len * 0.25, -wid, len * 0.75, -wid * 0.9, len, 0);
  ctx.bezierCurveTo(len * 0.75, wid * 0.9, len * 0.25, wid, 0, 0);
  ctx.fillStyle = col; ctx.fill();
  if (rib) { ctx.strokeStyle = rib; ctx.lineWidth = Math.max(1, wid * 0.06); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -wid * 0.08, len * 0.97, 0); ctx.stroke(); }
  ctx.restore();
}

// ---------- seeded content ----------
let ICON;
const R0 = rng(7);
const SKY_STARS = Array.from({ length: 260 }, () => ({ x: R0() * W, y: R0() * H, r: (0.6 + R0() * R0() * 2.2) * S, a: 0.35 + R0() * 0.65, k: 2 + Math.floor(R0() * 6), p: R0() * TAU }));
const WIN_STARS = Array.from({ length: 70 }, () => ({ x: (R0() - 0.5) * 340, y: -240 + R0() * 250, r: 0.8 + R0() * 1.8, a: 0.4 + R0() * 0.6 }));
const nR = [noise1(11), noise1(23), noise1(37), noise1(41), noise1(53), noise1(67)];
function ridge(n, u) {
  const a = 1 - Math.abs(n(u)), b = 1 - Math.abs(n(u * 2.13 + 9.1)), c = n(u * 4.7 + 3.3);
  return 0.62 * a * a + 0.28 * b * b + 0.1 * c;
}

// ============================================================
// SCENE 1: in flight at sunset, airplane mode
// ============================================================
function flightSky(cx, cy, lt, k) {
  ctx.fillStyle = vg(cy - 240 * S, cy + 240 * S, [[0, "#1c2e4a"], [0.3, "#3d5a78"], [0.5, "#c98d78"], [0.62, "#f6b774"], [0.7, "#f9d49a"], [1, "#b8705c"]]);
  ctx.fillRect(cx - 180 * S, cy - 250 * S, 360 * S, 500 * S);
  for (const s of WIN_STARS) { if (s.y < -150) { ctx.fillStyle = `rgba(255,248,230,${s.a * 0.45})`; ctx.fillRect(cx + s.x * S, cy + s.y * S, s.r * S, s.r * S); } }
  if (k === 0) {
    ctx.fillStyle = rg(cx + 60 * S, cy + 30 * S, 0, 220 * S, [[0, "rgba(255,238,190,0.95)"], [0.25, "rgba(255,200,130,0.5)"], [1, "rgba(255,190,120,0)"]]);
    ctx.fillRect(cx - 180 * S, cy - 250 * S, 360 * S, 500 * S);
    ctx.fillStyle = "#fff1cc"; ctx.beginPath(); ctx.arc(cx + 60 * S, cy + 30 * S, 30 * S, 0, TAU); ctx.fill();
  }
  // sea of clouds, three layers rushing past
  const cols = [["#b87766", "#e7a784"], ["#d49378", "#f6c69c"], ["#eab28c", "#ffe6c4"]];
  for (let j = 0; j < 3; j++) {
    const y0 = cy + (40 + j * 62) * S, sp = (90 + j * 260) * S, amp = (10 + j * 9) * S, per = (34 + j * 22) * S;
    ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 260 * S);
    for (let x = cx - 200 * S; x <= cx + 200 * S; x += 5 * S) {
      const u = (x + lt * sp) / per;
      ctx.lineTo(x, y0 - amp * Math.abs(Math.sin(u)) - amp * 0.5 * Math.abs(Math.sin(u * 0.47 + j)));
    }
    ctx.lineTo(cx + 200 * S, cy + 260 * S); ctx.closePath();
    ctx.fillStyle = vg(y0 - amp * 1.5, y0 + 90 * S, [[0, cols[j][1]], [0.35, cols[j][0]], [1, "#6d4550"]]); ctx.fill();
  }
  if (k === 0) {
    // wing
    ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 132 * S); ctx.lineTo(cx + 104 * S, cy + 70 * S); ctx.lineTo(cx + 114 * S, cy + 80 * S); ctx.lineTo(cx - 200 * S, cy + 232 * S); ctx.closePath();
    ctx.fillStyle = vg(cy + 70 * S, cy + 232 * S, [[0, "#4a3438"], [1, "#1a1214"]]); ctx.fill();
    ctx.strokeStyle = "rgba(255,214,170,0.7)"; ctx.lineWidth = 2 * S; ctx.beginPath(); ctx.moveTo(cx - 200 * S, cy + 132 * S); ctx.lineTo(cx + 104 * S, cy + 70 * S); ctx.stroke();
    const on = ((lt * 1.25) % 1 + 1) % 1 < 0.14;
    if (on) { ctx.fillStyle = rg(cx + 110 * S, cy + 75 * S, 0, 40 * S, [[0, "rgba(255,70,70,0.95)"], [0.25, "rgba(255,70,70,0.5)"], [1, "rgba(255,70,70,0)"]]); ctx.fillRect(cx + 60 * S, cy + 25 * S, 100 * S, 100 * S); }
    ctx.fillStyle = on ? "#ff6a6a" : "#5a1a2a"; ctx.beginPath(); ctx.arc(cx + 110 * S, cy + 75 * S, 4 * S, 0, TAU); ctx.fill();
  }
}
function flightWindow(cx, cy, lt, k, portal, skyA) {
  // bezel
  rr(cx - 225 * S, cy - 305 * S, 450 * S, 610 * S, 215 * S);
  ctx.fillStyle = hg(cx - 225 * S, cx + 225 * S, [[0, "#6b5048"], [0.5, "#8a6a5c"], [1, "#58403a"]]); ctx.fill();
  rr(cx - 190 * S, cy - 262 * S, 380 * S, 524 * S, 190 * S);
  ctx.fillStyle = vg(cy - 262 * S, cy + 262 * S, [[0, "#2b1e1c"], [1, "#4a3530"]]); ctx.fill();
  ctx.save();
  rr(cx - 165 * S, cy - 235 * S, 330 * S, 470 * S, 165 * S); ctx.clip();
  if (portal) portal();
  if (!portal || skyA > 0) { ctx.globalAlpha = portal ? skyA : 1; flightSky(cx, cy, lt, k); ctx.globalAlpha = 1; }
  if (!portal || skyA > 0) {
    ctx.globalAlpha = portal ? skyA : 1;
    const sh = [0.62, 0.16, 0.34][k + 1];
    ctx.fillStyle = vg(cy - 235 * S, cy - 235 * S + 470 * S * sh, [[0, "#f3e3cf"], [1, "#dcc4ab"]]);
    ctx.fillRect(cx - 170 * S, cy - 240 * S, 340 * S, 470 * S * sh + 5 * S);
    ctx.fillStyle = "#b8977c"; ctx.fillRect(cx - 40 * S, cy - 235 * S + 470 * S * sh - 10 * S, 80 * S, 6 * S);
    // glass reflection
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.beginPath(); ctx.moveTo(cx - 120 * S, cy + 240 * S); ctx.lineTo(cx - 40 * S, cy + 240 * S); ctx.lineTo(cx + 150 * S, cy - 240 * S); ctx.lineTo(cx + 70 * S, cy - 240 * S); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawFlight(lt, o = {}) {
  ctx.save();
  const zi = 1 + 0.07 * clamp(lt / 2.5);
  const bob = Math.sin(lt * 6.1) * 2.5 * S + Math.sin(lt * 14.3) * 1.2 * S;
  cam({ z: (o.z || 1) * zi, dy: bob });
  big(vg(F.y - 900 * S, F.y + 900 * S, [[0, "#241816"], [0.3, "#4a342e"], [0.55, "#5e443a"], [0.8, "#3c2a26"], [1, "#1a1110"]]));
  // warm pool of light from the reading lamp
  ctx.fillStyle = rg(F.x + 360 * S, F.y - 560 * S, 0, 1000 * S, [[0, "rgba(255,178,92,0.6)"], [0.35, "rgba(255,140,80,0.2)"], [1, "rgba(255,140,80,0)"]]);
  ctx.fillRect(F.x - 1500 * S, F.y - 1600 * S, 3500 * S, 2600 * S);
  // overhead bins
  ctx.fillStyle = vg(F.y - 1000 * S, F.y - 400 * S, [[0, "#1a1110"], [1, "#3a2824"]]);
  ctx.fillRect(F.x - 3000 * S, F.y - 1400 * S, 6000 * S, 1000 * S);
  ctx.fillStyle = "rgba(255,190,120,0.55)"; ctx.fillRect(F.x - 3000 * S, F.y - 404 * S, 6000 * S, 3 * S);
  // lamp
  ctx.fillStyle = rg(F.x + 360 * S, F.y - 420 * S, 0, 60 * S, [[0, "rgba(255,236,190,1)"], [0.3, "rgba(255,200,130,0.6)"], [1, "rgba(255,200,130,0)"]]);
  ctx.fillRect(F.x + 290 * S, F.y - 480 * S, 140 * S, 120 * S);
  // panel seams
  ctx.strokeStyle = "rgba(20,10,8,0.35)"; ctx.lineWidth = 3 * S;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(F.x + (k * 600 + 300) * S, F.y - 400 * S); ctx.lineTo(F.x + (k * 600 + 300) * S, F.y + 1400 * S); ctx.stroke(); }
  for (const k of [-1, 0, 1]) flightWindow(F.x + k * 600 * S, F.y, lt, k, k === 0 ? o.portal : null, o.skyA ?? 1);
  // seat backs in the foreground
  const seat = (x, y, w, h) => {
    rr(x, y, w, h, [150 * S, 150 * S, 20 * S, 20 * S]); ctx.fillStyle = vg(y, y + h * 0.6, [[0, "#4a3a34"], [1, "#150e0c"]]); ctx.fill();
    ctx.strokeStyle = "rgba(255,180,110,0.55)"; ctx.lineWidth = 3 * S; ctx.beginPath(); ctx.arc(x + w / 2, y + 150 * S, w / 2 - 2 * S, Math.PI * 1.08, Math.PI * 1.5); ctx.stroke();
    rr(x + w * 0.2, y + 26 * S, w * 0.6, 92 * S, 30 * S); ctx.fillStyle = "rgba(240,224,204,0.85)"; ctx.fill();
    ctx.fillStyle = "rgba(150,110,90,0.4)"; ctx.fillRect(x + w * 0.2, y + 96 * S, w * 0.6, 22 * S);
  };
  if (LAND) { seat(F.x - 720 * S, F.y + 330 * S, 420 * S, 700 * S); seat(F.x + 330 * S, F.y + 300 * S, 420 * S, 700 * S); }
  else { seat(F.x - 520 * S, F.y + 420 * S, 440 * S, 900 * S); seat(F.x + 180 * S, F.y + 460 * S, 440 * S, 900 * S); }
  ctx.restore();
}

// ============================================================
// SCENE 2: underground, a train in a tunnel
// ============================================================
function drawSubway(lt, o = {}) {
  ctx.save();
  cam({ z: o.z || 1, dx: Math.sin(lt * 29) * 1.8 * S, dy: Math.sin(lt * 23 + 1) * 1.8 * S });
  const vx = F.x, vy = F.y;
  big("#021210");
  const ph = lt * 7 + (o.boost || 0);
  const n0 = Math.floor(ph) + 1, N = 40;
  const fog = "#021210";
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, r = 470 * S / z;
    const f = clamp((z - 0.6) / 14);
    const base = n % 2 ? "#1c7563" : "#145a4c";
    ctx.fillStyle = mix(base, fog, Math.pow(f, 0.7));
    ctx.beginPath(); ctx.arc(vx, vy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = mix("#3fae90", fog, Math.pow(f, 0.6)); ctx.lineWidth = Math.max(1, 7 * S / z);
    ctx.stroke();
  }
  // cables along the walls (radial in projection)
  ctx.strokeStyle = "rgba(0,10,8,0.8)";
  for (const a of [-2.75, -2.62, 0.35, 2.95]) { ctx.lineWidth = 6 * S; ctx.beginPath(); ctx.moveTo(vx + Math.cos(a) * 30 * S, vy + Math.sin(a) * 30 * S); ctx.lineTo(vx + Math.cos(a) * 2600 * S, vy + Math.sin(a) * 2600 * S); ctx.stroke(); }
  // floor
  const Rb = 4000 * S;
  ctx.beginPath(); ctx.moveTo(vx, vy + 2 * S); ctx.lineTo(vx - 0.8 * Rb, vy + 0.6 * Rb); ctx.lineTo(vx + 0.8 * Rb, vy + 0.6 * Rb); ctx.closePath();
  ctx.fillStyle = vg(vy, vy + 700 * S, [[0, "#021210"], [1, "#0c2a24"]]); ctx.fill();
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, r = 470 * S / z, f = clamp((z - 0.6) / 14);
    ctx.fillStyle = mix("#2c4a42", fog, f);
    ctx.fillRect(vx - 0.36 * r, vy + 0.6 * r, 0.72 * r, Math.max(1, 0.05 * r));
  }
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(vx + s * 1 * S, vy + 1 * S); ctx.lineTo(vx + s * 0.2 * Rb, vy + 0.6 * Rb); ctx.lineTo(vx + s * 0.214 * Rb, vy + 0.6 * Rb); ctx.closePath();
    ctx.fillStyle = vg(vy, vy + 600 * S, [[0, "rgba(190,255,235,0.1)"], [1, "rgba(190,255,235,0.85)"]]); ctx.fill();
  }
  // lamps, streaking toward the camera
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  for (let n = n0; n < n0 + N; n++) {
    const d = n - ph, z = 0.22 + d * 0.4, z2 = Math.max(0.12, z - 0.5), r = 470 * S / z, r2 = 470 * S / z2, f = clamp((z - 0.6) / 14);
    const lamps = n % 2 === 0 ? [[-2.3, "150,255,220"], [-0.84, "150,255,220"]] : [];
    if (n % 7 === 3) lamps.push([0.55, "255,80,60"]);
    for (const [a, c] of lamps) {
      const x1 = vx + Math.cos(a) * r * 0.9, y1 = vy + Math.sin(a) * r * 0.9, x2 = vx + Math.cos(a) * r2 * 0.9, y2 = vy + Math.sin(a) * r2 * 0.9;
      const al = (1 - f) * 0.95;
      ctx.strokeStyle = `rgba(${c},${al * 0.35})`; ctx.lineWidth = 34 * S / z; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = `rgba(${c},${al})`; ctx.lineWidth = 9 * S / z; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
  // headlight wash on the near walls
  ctx.fillStyle = rg(vx, vy, 80 * S, 1400 * S, [[0, "rgba(120,255,210,0)"], [1, "rgba(120,255,210,0.10)"]]);
  ctx.fillRect(-W, -H, 3 * W, 3 * H);
  ctx.globalCompositeOperation = "source-over";
  // light at the end of the tunnel
  const er = o.exitR || 13 * S;

// ============================================================
// WORLD: scenes and the transitions between them
// ============================================================
function inScreen(fn) { return () => screen(fn); }

function drawWorld(tau) {
  const lt = (i) => tau - B[i];

  if (tau < 0.55) {
    const e = eIO(inv(0, 0.55, tau));
    drawEndSky(tau);
    drawFlight(lt(0), { z: Math.pow(9, 1 - e), portal: inScreen(() => drawEndSky(tau)), skyA: clamp((e - 0.15) / 0.6) });
    return;
  }
  // flight -> subway: through the window, into the tunnel mouth
  if (tau < 2.1) return drawFlight(lt(0));
  if (tau < 2.5) {
    const e = inv(2.1, 2.5, tau), z = Math.pow(9, e * e);
    return drawFlight(lt(0), { z, portal: inScreen(() => drawSubway(lt(1), { z: lerp(0.7, 1, e) })), skyA: 0 });
  }
  // subway -> peak: out through the light at the end of the tunnel
  if (tau < 4.15) return drawSubway(lt(1));
  if (tau < 4.6) {
    const e = inv(4.15, 4.6, tau), d = Math.hypot(W, H);
    drawSubway(lt(1), { boost: 3 * e * e, exitR: lerp(13 * S, d, Math.pow(e, 2.4)), portal: inScreen(() => drawPeak(lt(2))) });

    return;
  }

  if (tau < 6.3) return drawPeak(lt(2));
  if (tau < 6.72) {
    const e = eIO(inv(6.3, 6.72, tau));
    clipRect(0, -e * H, W, H, () => drawPeak(lt(2), { dy: -e * H }));
    clipRect(0, (1 - e) * H, W, H, () => drawGarden(lt(3), { dy: (1 - e) * H }));
    const a = Math.sin(e * Math.PI) * 0.5, R = rng(4);
    ctx.fillStyle = `rgba(255,255,255,${a * 0.5})`;
    for (let i = 0; i < 40; i++) ctx.fillRect(R() * W, R() * H - 200 * S, (1 + R() * 3) * S, (120 + R() * 400) * S);
    return;
  }
  // garden -> sea: a wall of leaves sweeps across
  if (tau < 8.35) return drawGarden(lt(3));
  if (tau < 8.85) {
    const e = eIO(inv(8.35, 8.85, tau)), X = lerp(W + 0.35 * W, -0.45 * W, e);

      const y = (i / 25) * (H + 200 * S) - 100 * S, len = (380 + R() * 380) * S;
      leaf(X - 120 * S + R() * 160 * S, y, len, len * 0.24, Math.PI + (R() - 0.5) * 1.2 + e * 0.6, R() < 0.5 ? "#3f6a2c" : "#5a8a3a", "rgba(230,240,180,0.5)");
    }
    return;
  }
  // sea -> road: the horizon holds, the world splits open along it
  if (tau < 10.5) return drawSea(lt(4));
  if (tau < 10.92) {
    const e = eIO(inv(10.5, 10.92, tau));
    drawSea(lt(4));
    const top = HY - e * (HY + 20), bot = HY + e * (H - HY + 20);

  }

  if (tau < 12.8) return drawRoad(lt(5));
  if (tau < 13.35) {

    clipRect(0, e * H * 0.9, W, H, () => drawRoad(lt(5), { dy: e * H * 0.9 }));
    ctx.restore();
    ctx.fillStyle = vg(e * H * 0.9 - 10, e * H * 0.9 + 400 * S, [[0, rgba(BRAND.dawnMid, 1)], [1, rgba(BRAND.dawnMid, 0)]]);
    if (e > 0.02) ctx.fillRect(0, e * H * 0.9 - 10, W, 410 * S);
    return;

// One exchange, as the app lays it out. Returns the bubbles' geometry for a given reveal state.

  const gap = u(12);

  const scroll = clamp(contentH - vH, 0, Math.max(0, qKeep));

  ctx.save(); ctx.beginPath(); ctx.rect(X, vTop, SW, vH); ctx.clip();

    ctx.save(); ctx.translate(qx + qW, cy + qH); ctx.scale(pp, pp); ctx.translate(-(qx + qW), -(cy + qH));
    ctx.beginPath(); ctx.roundRect(qx, cy, qW, qH, [u(12), u(12), u(4), u(12)]); ctx.fillStyle = APP.userBg; ctx.fill();
    ctx.strokeStyle = APP.userBorder; ctx.lineWidth = u(1.6); ctx.stroke();
    af(600, 11.5, APP.mono); ctx.letterSpacing = `${u(0.6)}px`; ctx.fillStyle = APP.you; ctx.fillText("YOU", qx + pad, cy + pad + u(11)); ctx.letterSpacing = "0px";
    af(400, 18); ctx.fillStyle = APP.text;

    ctx.beginPath(); ctx.roundRect(ax, cy, aW, aH, [u(12), u(12), u(12), u(4)]); ctx.fillStyle = APP.astBg; ctx.fill();
    ctx.strokeStyle = APP.astBorder; ctx.lineWidth = u(1.2); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(ax, cy, aW, aH); ctx.clip();
    let yy = cy + pad;
    af(400, 11, "Apple Color Emoji"); ctx.fillText("🐗", ax + pad, yy + u(11));
    af(600, 11.5, APP.mono); ctx.letterSpacing = `${u(0.6)}px`; ctx.fillStyle = APP.boar; ctx.fillText("BOAR", ax + pad + u(20), yy + u(11)); ctx.letterSpacing = "0px";

    for (const [bx, g] of [[ax + pad, "▲"], [ax + pad + u(40), "▼"]]) { rr(bx, yy, u(32), u(22), u(4)); ctx.fillStyle = APP.footBtn; ctx.fill(); ctx.strokeStyle = APP.footBorder; ctx.lineWidth = u(1); ctx.stroke(); af(700, 9); ctx.fillStyle = APP.boar; ctx.textAlign = "center"; ctx.fillText(g, bx + u(16), yy + u(15)); ctx.textAlign = "left"; }
    { const bx = ax + aW - pad - u(32); rr(bx, yy, u(32), u(22), u(4)); ctx.fillStyle = APP.footBtn; ctx.fill(); ctx.strokeStyle = APP.footBorder; ctx.stroke(); ctx.strokeStyle = APP.boar; ctx.lineWidth = u(1.3); ctx.strokeRect(bx + u(11), yy + u(5), u(8), u(8)); ctx.strokeRect(bx + u(14), yy + u(9), u(8), u(8)); }
    ctx.restore();
    ctx.restore();
  }

  // ---- status bar (constant; only the clock and the network label change) ----
  ctx.fillStyle = APP.status; ctx.fillRect(X, Y, SW, SB);
  const sbY = Y + u(27);
  const roll = i === 0 ? 1 : eIO(clamp((tau - B[i] + 0.05) / 0.28));
  const prev = i === 0 ? null : SC[i - 1];
  ctx.save(); ctx.beginPath(); ctx.rect(X, Y, SW, SB); ctx.clip();
  af(600, 16.5); ctx.fillStyle = "#ffffff";
  const rh = u(26);
  if (prev && roll < 1) { ctx.globalAlpha = 1 - roll; ctx.fillText(prev.clock, X + u(22), sbY - roll * rh); }
  ctx.globalAlpha = roll; ctx.fillText(D.clock, X + u(22), sbY + (1 - roll) * rh); ctx.globalAlpha = 1;

  rr(bx + u(2.5), sbY - u(10), u(14), u(9), u(2.5)); ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.fillRect(bx + u(27), sbY - u(8), u(2), u(5));
  const netLabel = (d) => (d.air ? "Airplane mode" : "No Service");
  const drawNet = (d, dy, a) => {
    ctx.globalAlpha = a; af(500, 14.5); ctx.fillStyle = "#ffffff";
    const lab = netLabel(d), lw = ctx.measureText(lab).width;
    const gx = bx - u(10) - u(18);

  rr(ox, hy + u(16), ow, u(20), u(5)); ctx.fillStyle = APP.pillBg; ctx.fill(); ctx.strokeStyle = APP.pillBorder; ctx.lineWidth = u(1.2); ctx.stroke();
  ctx.fillStyle = APP.pillText; ctx.beginPath(); ctx.arc(ox + u(8), hy + u(26), u(2.8), 0, TAU); ctx.fill();
  ctx.fillText("OFFLINE", ox + u(15), hy + u(30)); ctx.letterSpacing = "0px";
  af(400, 11.5, APP.mono); ctx.letterSpacing = `${u(1)}px`; ctx.fillStyle = APP.model; ctx.fillText("QWEN2.5-1.5B-INSTRUCT (Q4_K_M)", X + u(108), hy + u(54)); ctx.letterSpacing = "0px";

function drawVignette() {
  const m = Math.max(W, H);
  ctx.fillStyle = rg(W * 0.55, H * 0.5, m * 0.3, m * 0.85, [[0, "rgba(0,0,8,0)"], [1, "rgba(0,0,8,0.42)"]]);
  ctx.fillRect(0, 0, W, H);
}

window.renderFrame = function (t) {
  const tau = ((t % T) + T) % T;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.letterSpacing = "0px"; ctx.textAlign = "left";
  ctx.clearRect(0, 0, W, H);
  drawWorld(tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawVignette();
  if (!Q.has("nocard")) drawCardLayer(tau);   // ?nocard: the world alone (the page's scene thumbnails)
};

function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
window.ready = (async () => {

    document.fonts.load(`400 20px "Roboto"`), document.fonts.load(`600 20px "Noto Sans Mono"`), document.fonts.load(`20px "Apple Color Emoji"`)]);
